[project]
name = "cell-classifier-mlops"
version = "0.1.0"
description = """
    An imbalanced biomedical image classifier with a frozen ViT backbone. 
    Trained reproducibly, versioned in a model registry, served behind an API, 
    and shipped by CI/CD with a rollback path.
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.25.3",
    "azureml-mlflow>=1.62.0.post5",
    "fastapi>=0.141.0",
    "mlflow-skinny>=2.18,<3",
    "numpy>=2.5.1",
    "pandas>=2.2",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "timm>=1.0.28",
    "uvicorn[standard]>=0.52.0",
]

[project.optional-dependencies]
cpu = ["torch>=2.13.0", "torchvision>=0.28.0"]
cu126 = ["torch>=2.13.0", "torchvision>=0.28.0"]

[tool.uv]
default-groups = ["dev", "train"]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu"},
    { index = "pytorch-cu126", extra = "cu126"},
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu"},
    { index = "pytorch-cu126", extra = "cu126"},
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "types-pyyaml>=6.0.12.20260724",
]
train = [
    "dvc>=3.67.1",
    "dvc-azure>=3.1.1",
    "matplotlib>=3.11.1",
    "medmnist>=3.0.2",
    "mlflow>=2.18,<3",
    "scikit-learn>=1.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"] 

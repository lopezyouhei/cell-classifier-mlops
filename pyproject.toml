[project]
name = "cell-classifier-mlops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.0",
    "mlflow>=3.14.0",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "timm>=1.0.28",
    "torch>=2.13.0",
    "uvicorn[standard]>=0.52.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'"},
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'"},
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
train = [
    "dvc>=3.67.1",
    "dvc-s3>=3.3.0",
    "matplotlib>=3.11.1",
    "medmnist>=3.0.2",
    "scikit-learn>=1.9.0",
    "torchvision>=0.28.0",
]

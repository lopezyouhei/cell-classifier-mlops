name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Code checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      
      - name: Install
        run: uv sync --frozen --extra cpu --group dev
      
      - name: Lint
        run: uv run ruff check .
      
      - name: Format check
        run: uv run ruff format --check

      - name: Type check
        run: uv run mypy src

      - name: Tests
        run: uv run pytest -v

  changes:
    name: Detect pipeline changes
    runs-on: ubuntu-latest
    outputs:
      pipeline: ${{ steps.filter.outputs.pipeline }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pipeline:
              - 'src/data.py'
              - 'src/embed.py'
              - 'src/evaluate.py'
              - 'src/model.py'
              - 'src/train.py'
              - 'configs/**'
              - 'dvc.yaml'
              - 'dvc.lock'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yaml'

  smoke-train:
    name: Train and quality gate
    runs-on: ubuntu-latest
    needs: [checks, changes]
    if: needs.changes.outputs.pipeline == 'true'
    permissions:
      id-token: write
      contents: read
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      
      - name: Install
        run: uv sync --frozen --extra cpu --group train --group dev

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Pull cached embeddings
        run: uv run dvc pull artifacts/embeddings artifacts/class_weights.npy artifacts/splits.json
      
      - name: Train head
        run: uv run python -m src.train --config configs/train.yaml

      - name: Evaluate and enforce quality gate
        run: uv run python -m src.evaluate --config configs/train.yaml
      
      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          retention-days: 14
          path: |
            artifacts/metrics.json
            artifacts/confusion_matrix.png
name: CD

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy, verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: GHCR login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.serve
          push: true
          build-args: GIT_SHA=${{ steps.meta.outputs.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/cell-classifier-mlops:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/cell-classifier-mlops:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Record current revision for rollback
        id: current
        run: |
          PREV=$(az containerapp show -n ca-cellclassifier -g rg-cellclassifier-dev-gwc \
            --query properties.latestReadyRevisionName -o tsv)
          echo "revision=$PREV" >> $GITHUB_OUTPUT
          echo "rollback target: $PREV"

      - name: Deploy
        run: |
          az containerapp update -n ca-cellclassifier -g rg-cellclassifier-dev-gwc \
          --image ghcr.io/${{ github.repository_owner }}/cell-classifier-mlops:${{ steps.meta.outputs.sha }}

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install smoke test dependencies
        run: uv sync --frozen --extra cpu --group dev

      - name: Smoke test
        id: smoke
        run: |
          FQDN=$(az containerapp show -n ca-cellclassifier -g rg-cellclassifier-dev-gwc \
            --query properties.configuration.ingress.fqdn -o tsv)
          uv run python scripts/smoke_predict.py \
            --url "https://$FQDN" \
            --expected-sha "${{ steps.meta.outputs.sha }}"

      - name: Rollback on failure
        if: failure() && steps.current.outputs.revision != ''
        run: |
          echo "smoke test failed - rolling back to ${{ steps.current.outputs.revision }}"
          az containerapp revision copy -n ca-cellclassifier -g rg-cellclassifier-dev-gwc \
            --from-revision ${{ steps.current.outputs.revision }}
          FQDN=$(az containerapp show -n ca-cellclassifier -g rg-cellclassifier-dev-gwc \
            --query properties.configuration.ingress.fqdn -o tsv)
          uv run python scripts/smoke_predict.py --url "https://$FQDN" || \
            echo "::error::rollback did not restore a healthy service"
          exit 1